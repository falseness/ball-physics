<!Doctype html>
<html>
<head>
    <title>Ball physics</title>
    <meta charset = "UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    
    <style>
        #canvas
        {
            display:block;
            position:fixed;
            margin:0;
            padding:0;
            touch-action:none;
        }
        @font-face { font-family: 'Caveat'; src: url('fonts/caveat-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
        @font-face { font-family: 'Caveat'; src: url('fonts/caveat-700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: block; }
        html, body
        {
            padding:0;
            margin:0;
            overflow:hidden;
        }
    </style>
</head>
<body>
    <canvas id = "canvas" width = "1280" height = "800"></canvas>
    <script src = "js/theme.js"></script>
    <script src = "js/sketch.js"></script>
    <script src = "js/sprite.js"></script>
    <script src = "js/line.js"></script>
    <script src = "js/levels.js"></script>
    <script src = "js/ball.js"></script>
    <script src = "js/trail.js"></script>
    <script src = "js/newline.js"></script>
    <script src = "js/flag.js"></script>
    <script src = "js/annotate.js"></script>
    <script src = "js/levelsRects.js"></script>
    <script src = "js/gamebreak.js"></script>
    <script src = "js/menu.js"></script>
    <script src = "js/bounce.js"></script>
    <script src = "js/portal.js"></script>
    <script src = "js/editor.js"></script>
    <script src = "js/draw.js"></script>
    <script src = "js/select.js"></script>
    <script src = "js/visualsperf.js"></script>
    <script>
        'use strict'
        let canvas = document.getElementById('canvas')
        let ctx = canvas.getContext('2d')
        canvas.width = GAME_W
        canvas.height = GAME_H
        // Largest backing-store width; bigger CSS-size x DPR products are scaled down proportionally
        const MAX_BACKING_W = 4096
        // Letterbox: scale the fixed GAME_W x GAME_H canvas uniformly to fit the window, centred.
        // The backing store follows the on-screen size x devicePixelRatio (sharp on HiDPI and
        // when scaled up); drawing code stays in logical GAME_W x GAME_H coordinates via
        // applyViewTransform().
        function fitCanvas()
        {
            let s = Math.min(window.innerWidth / GAME_W, window.innerHeight / GAME_H)
            let w = GAME_W * s, h = GAME_H * s
            canvas.style.width = w + 'px'
            canvas.style.height = h + 'px'
            canvas.style.left = (window.innerWidth - w) / 2 + 'px'
            canvas.style.top = (window.innerHeight - h) / 2 + 'px'
            let k = Math.min(s * (window.devicePixelRatio || 1), MAX_BACKING_W / GAME_W)
            let bw = Math.round(GAME_W * k), bh = Math.round(GAME_H * k)
            if (canvas.width != bw || canvas.height != bh)
            {
                canvas.width = bw
                canvas.height = bh
            }
        }
        // logical GAME_W x GAME_H -> backing-store pixels
        function applyViewTransform()
        {
            let k = canvas.width / GAME_W
            ctx.setTransform(k, 0, 0, k, 0, 0)
        }
        // Re-fit when the device pixel ratio changes (zoom, moving to another monitor)
        function watchDevicePixelRatio()
        {
            let mq = window.matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)')
            mq.addEventListener('change', function() { fitCanvas(); watchDevicePixelRatio() }, {once: true})
        }
        fitCanvas()
        window.addEventListener('resize', fitCanvas)
        if (window.matchMedia)
            watchDevicePixelRatio()
        let cyclesPerTact = 500
        let gravitationalAcceleration = 0.001 / cyclesPerTact //0.000001
            
        let ball = new Ball(10, 20, 80, 0, 0, '#ff0000', 'ball')

        //lines.push(new Line(0, 300, 300, 300, 0, 0, 5, '#0000ff', 'line'))
        //lines.push(new Line(200, 200, 600, 400, 0, 0, 5, '#0000ff', 'line'))
        let linesK
        
        
        let menuIconRect = [
            [GAME_W - 63 - 20, 20],
            [63, 63]
        ]
        let menuIconLine = [
            [5, 13], [-5, 22],
            [5, 28], [-5, 33],
            [5, 43], [-5, 44]
        ]
        let startIconTriangle = 
        [
            [menuIconRect[0][0] - 15, menuIconRect[0][1] + 31],
            [menuIconRect[0][0] - 10 - 54, menuIconRect[0][1] + menuIconRect[1][1] - 5],
            [menuIconRect[0][0] - 10 - 54, menuIconRect[0][1] + menuIconRect[1][1] - 62 + 5]
        ]
        let drawMenu = false
        let drawMenuIcon = true
        let physics = false
        
        let levelStarted = false
        
        function addNewLine(coords)
        {
            coords = dotСorrection(coords[0], coords[1], line.radius)
            if (pointSegDist(ball.posX, ball.posY, line.posX, line.posY, coords[0], coords[1]) <= ball.radius)
                return false
            line.posX2 = coords[0]
            line.posY2 = coords[1]
            line.type = 'player'
            lines.push(line)
            
            return true
        }
        function unfastenLastLine()
        {
            lines.pop()
        }
        function levelChoosed(i)
        {
            const L = playtestLevel || levels[i]
            ball.posX = L.ballX
            ball.posY = L.ballY
            ball.speedX = ball.speedY = 0
            lines = L.lines.slice()
            linesK = 0
            levelStarted = false
            physics = false
            playerSel = null
            lockHint = null
            flag = []
            for (let i = 0; i < flagCoords.length; ++i)
            {
                let coord = pointRotation(flagCoords[i][0], flagCoords[i][1], L.flagRotate)
                flag.push(coord)
            }
            
            bounce.setDrawEnable(true)
            portalReset()
            portalRefresh()
            trailReset()
        }
        
        levelChoosed(thisLevel)
        function inMenuIcon(coords)
        {
            return collisionWithRect(
                coords[0], coords[1], menuIconRect[0][0], menuIconRect[0][1], 
                menuIconRect[0][0] + menuIconRect[1][0], menuIconRect[0][1] + menuIconRect[1][1])
        }
        function inPlayIcon(coords)
        {
            return collisionWithRect(
                coords[0], coords[1], menuIconRect[0][0] - 73, menuIconRect[0][1], menuIconRect[0][0] - 73 + menuIconRect[1][0], menuIconRect[0][1] + menuIconRect[1][1])
        }
        // HUD 'restart' box (artifacts/concepts/82-restart-loop.png): left of the play box, only once
        // a run was started (running or paused); resets the ball but keeps the player's lines
        function restartIconRect()
        {
            return [menuIconRect[0][0] - 146, menuIconRect[0][1], menuIconRect[1][0], menuIconRect[1][1]]
        }
        function inRestartIcon(coords)
        {
            const r = restartIconRect()
            return collisionWithRect(coords[0], coords[1], r[0], r[1], r[0] + r[2], r[1] + r[3])
        }
        function restartIconVisible()
        {
            return levelStarted && !editorMode && !drawMenu && !levelCompletedWindow && drawMenuIcon
        }
        document.addEventListener('click', function(event)
        {
            if (suppressClick)
            {
                suppressClick = false // the click that ends a player-line end drag does nothing
                return
            }
            handleClick(mouseCoords(event))
        })
        // One click (mouse) or tap (touch) at logical coords
        function handleClick(coords)
        {
            if (editorMode)
            {
                editorClick(coords)
                return
            }
            if (playtestLevel && !drawMenu && inEditIcon(coords))
            {
                editorEndPlaytest()
                return
            }
            if (levelCompletedWindow && !playtestLevel && inEditorButton(coords))
            {
                levelCompletedWindow = false
                editorOpen() // edit the level just won
                return
            }
            if ((levelCompletedWindow || drawMenu) && levelsRectCollision(coords[0], coords[1]))
            {
                return    
            }
            if (levelCompletedWindow)
            {
                if ((playtestLevel || thisLevel + 1 < levels.length) && collisionWithRect(
                        coords[0], coords[1], 
                        menuCoords[0] + (menuSize[0] - menuTextRect[0]) / 2, 
                        menuCoords[1] + blocks[1], 
                        menuCoords[0] + (menuSize[0] - menuTextRect[0]) / 2 + menuTextRect[0], 
                        menuCoords[1] + blocks[1] + menuTextRect[1]))
                {
                    if (playtestLevel)
                    {
                        editorEndPlaytest() // play-test: 'editor' instead of 'next level'
                        return
                    }
                    levelChoosed(++thisLevel)
                    levelCompletedWindow = false
                }
                else if (collisionWithRect(
                        coords[0], coords[1],
                        menuCoords[0] + (menuSize[0] - menuTextRect[0]) / 2, 
                        menuCoords[1] + blocks[2],
                        menuCoords[0] + (menuSize[0] - menuTextRect[0]) / 2 + menuTextRect[0], 
                        menuCoords[1] + blocks[2] + menuTextRect[1]))
                {
                    levelChoosed(thisLevel)
                    levelCompletedWindow = false
                }
            }
            else if (drawMenu)
            {
                if (inEditorButton(coords))
                {
                    if (playtestLevel)
                        editorEndPlaytest() // back to the same working copy
                    else
                        editorOpen()
                    return
                }
                for (let i = 0; i < menuButtons.length - 1; ++i)
                {
                    if (collisionWithRect(
                        coords[0], coords[1], 
                        menuCoords[0] + (menuSize[0] - menuTextRect[0]) / 2, 
                        menuCoords[1] + 300 + i * 85, 
                        menuTextRect[0] + menuCoords[0] + (menuSize[0] - menuTextRect[0]) / 2, 
                        menuTextRect[1] + menuCoords[1] + 300 + i * 85))
                        {
                            drawMenu = false
                            drawMenuIcon = true
                            if (menuButtons[i] == 'restart')
                            {
                                levelChoosed(thisLevel)
                            }
                        }
                }
            }
            else
            {
                if (restartIconVisible() && inRestartIcon(coords))
                {
                    selectionClear()
                    restartKeepLines() // ball back to the start, lines kept and editable again
                    return
                }
                if (line)
                {
                    if (!addNewLine(coords))
                        return
                    line = false
                    bounce.cancel() // an unfinished preview job is dropped
                    if (linesK >= curLevel().lineK)
                    {
                        selectionClear()
                        bounce.setDrawEnable(false)
                        physics = true
                        levelStarted = true
                    }
                }
                else
                {
                    if (playerSel !== null && selectionEditable() && inBin(coords))
                    {
                        deleteSelectedLine() // bin: remove the selected player line
                    }
                    else if (!line && inMenuIcon(coords))
                    {
                        selectionClear()
                        drawMenu = true
                        drawMenuIcon = false
                        physics = false
                    }
                    else if (inPlayIcon(coords))
                    {
                        selectionClear()
                        physics = !physics
                        levelStarted = true
                    }
                    else if (levelStarted)
                    {
                        lockClick(coords) // run started: player lines are locked, show a hint
                    }
                    else if (startLineAtEnd(coords))
                    {
                        // a click on a player line end (lines left) started a line there
                    }
                    else if (playerSel !== null && selectionEditable())
                    {
                        selectionClick(coords) // select another player line or deselect; no new line
                    }
                    else if (!levelStarted)
                    {  
                        // a click on a player line selects it (priority over starting a line)
                        const hit = playerLineAt(coords[0], coords[1])
                        if (hit !== null)
                        {
                            playerSel = hit
                            return
                        }
                        if (linesK < curLevel().lineK)
                        {
                            coords = dotСorrection(coords[0], coords[1], dotRadius)
                            if (ball.collisionWithDot(coords[0], coords[1]))
                                return
                            line = new Line(coords[0], coords[1], coords[0], coords[1], dotRadius, '#0000ff', 'line')
                            linesK++
                        }
                    }
                }
            }
        }
        
        // Editor select tool: drag with the mouse. Outside editor mode a press on a player line
        // end (editable state) drags that end (select.js).
        document.addEventListener('mousedown', function(event)
        {
            if (editorMode)
                return editorMouseDown(mouseCoords(event))
            suppressClick = false
            if (event.button == 0 && !dragStart(mouseCoords(event)))
                lockPress(mouseCoords(event)) // locked after a run: hint only
        })
        document.addEventListener('mouseup', function(event)
        {
            if (editorMode)
                return editorMouseUp(mouseCoords(event))
            if (endDrag && dragDrop(mouseCoords(event)))
                suppressClick = true
        })
        document.addEventListener('mousemove', function(event)
        {
            if (editorMode)
            {
                // primary button no longer down: the mouseup was lost (window lost focus, released
                // outside the page), so no drop happened -> cancel the drag, move nothing this event
                if (editor.drag && (event.buttons & 1) == 0)
                    return editorCancelDrag()
                return editorMouseMove(mouseCoords(event))
            }
            if (endDrag)
            {
                if ((event.buttons & 1) == 0)
                    return dragCancel() // the mouseup was lost: no drop
                return dragMove(mouseCoords(event))
            }
            if (line)
                bounce.request(mouseCoords(event)) // computed progressively in gameLoop (bounce.update)
        })

        // Touch: a tap (touchend within TAP_SLOP logical px of touchstart) goes through handleClick()
        // like a mouse click; a drag on the play field starts a line at touchstart, previews it on
        // touchmove (as mousemove does) and finishes it at touchend (as the second click does).
        // preventDefault everywhere: no page scroll/zoom and no duplicate synthetic mouse click.
        const TAP_SLOP = 10
        let touch = null // {id, start, last, moved, startedLine, drag}
        // Would a click at coords start a new line? (same conditions as handleClick)
        function lineStartAccepted(coords)
        {
            if (editorMode || levelCompletedWindow || drawMenu || line || levelStarted)
                return false
            if (inMenuIcon(coords) || inPlayIcon(coords) || (playtestLevel && inEditIcon(coords)) || (restartIconVisible() && inRestartIcon(coords)))
                return false
            if (endStartPoint(coords))
                return true // on a player line end with lines left: a line starts at that end
            if (playerSel !== null || playerLineAt(coords[0], coords[1]) !== null)
                return false // the tap selects / deselects / deletes instead (handleClick at touchend)
            if (linesK >= curLevel().lineK)
                return false
            let c = dotСorrection(coords[0], coords[1], dotRadius)
            return !ball.collisionWithDot(c[0], c[1])
        }
        function findTouch(list)
        {
            for (let i = 0; i < list.length; ++i)
                if (list[i].identifier === touch.id)
                    return list[i]
            return null
        }
        function touchMoveTo(coords)
        {
            if (editorMode)
                return editorMouseMove(coords)
            if (endDrag)
                return dragMove(coords)
            if (line)
            {
                line.posX2 = coords[0]
                line.posY2 = coords[1]
                bounce.request(coords)
            }
        }
        canvas.addEventListener('touchstart', function(event)
        {
            event.preventDefault()
            if (touch)
                return // ignore extra fingers
            let t = event.changedTouches[0]
            let coords = mouseCoords(t)
            touch = {id: t.identifier, start: coords, last: coords, moved: false, startedLine: false, drag: false}
            if (editorMode)
                editorMouseDown(coords)
            else if (dragStart(coords))
                touch.drag = true // on a player line end: drag it instead of starting a line
            else
                lockPress(coords) // locked after a run: hint only
            if (!touch.drag && lineStartAccepted(coords))
            {
                handleClick(coords)
                touch.startedLine = !!line
            }
        }, {passive: false})
        canvas.addEventListener('touchmove', function(event)
        {
            event.preventDefault()
            if (!touch)
                return
            let t = findTouch(event.changedTouches)
            if (!t)
                return
            let coords = mouseCoords(t)
            touch.last = coords
            if (Math.hypot(coords[0] - touch.start[0], coords[1] - touch.start[1]) > TAP_SLOP)
                touch.moved = true
            touchMoveTo(coords)
        }, {passive: false})
        canvas.addEventListener('touchend', function(event)
        {
            event.preventDefault()
            if (!touch)
                return
            let t = findTouch(event.changedTouches)
            if (!t)
                return
            let coords = mouseCoords(t)
            let s = touch
            touch = null
            if (editorMode)
                editorMouseUp(coords)
            let tap = Math.hypot(coords[0] - s.start[0], coords[1] - s.start[1]) <= TAP_SLOP && !s.moved
            if (s.drag)
            {
                if (tap)
                {
                    dragCancel(true) // a tap on an end: select / deselect / bin as before
                    handleClick(s.start)
                }
                else
                    dragDrop(coords)
            }
            else if (tap)
            {
                // a tap that started a line already acted as the first click
                if (!s.startedLine)
                    handleClick(s.start)
            }
            else if (line)
            {
                touchMoveTo(coords)
                handleClick(coords)
            }
        }, {passive: false})
        canvas.addEventListener('touchcancel', function(event)
        {
            if (event.cancelable)
                event.preventDefault()
            touch = null
            if (editorMode)
                editorCancelDrag()
            dragCancel() // an end drag is reverted
        }, {passive: false})
        function gamePhysics()
        {
            ball.physics()
            ball.move()
            portalStep()
        }
        function restart()
        {
            levelChoosed(thisLevel)
        }
        // Automatic failure (ball off the map): reset the level but keep the player's lines and
        // linesK, so the player can press play again (menu 'restart' etc. still call levelChoosed)
        function restartKeepLines()
        {
            const kept = lines.filter(function(l) { return l.type == 'player' })
            const k = linesK
            levelChoosed(thisLevel)
            for (let i = 0; i < kept.length; ++i)
                lines.push(kept[i])
            linesK = k
            bounce.positions = [] // no stale path preview
        }
        function gameMechanics()
        {
            if (physics && !editorMode)
            {
                const teleports0 = portalState.teleports.length
                for (let i = 0; i < cyclesPerTact; ++i)
                {
                    gamePhysics()
                    if (flagCollision(curLevel().flagX, curLevel().flagY))
                    {
                        if (playtestLevel)
                        {
                            levelCompletedWindow = true // play-test: no unlock bookkeeping
                            continue
                        }
                        levels[thisLevel].unlock = 2
                        if (thisLevel + 1 < levels.length)
                            levels[thisLevel + 1].unlock = (levels[thisLevel + 1].unlock == 2)?2:1 
                        levelCompletedWindow = true
                    }
                    if (!ball.onMap())
                    {
                        restartKeepLines() // reset level, keep player lines: no more physics steps this frame
                        break
                    }
                }
                // trail: one sample per frame (drawing only; a teleport starts a new segment)
                if (physics)
                    trailRecord(portalState.teleports.length !== teleports0)
            }
        }
        function gameLoop()
        {
            bounce.update(6) // progressive path preview: at most ~6 ms of physics per frame
            editorPreviewUpdate(6) // editor: live path preview of the working copy (same budget)

            draw()

            gameMechanics()
            
            menu()
            
            requestAnimationFrame(gameLoop)
        }
        // Start drawing only once the handwriting font is ready (falls back to
        // starting anyway if the font cannot be loaded).
        let fontsReady = document.fonts
            ? Promise.all([
                document.fonts.load('24px ' + THEME.font),
                document.fonts.load('bold 24px ' + THEME.font)
            ]).catch(function() {})
            : Promise.resolve()
        fontsReady.then(function() { requestAnimationFrame(gameLoop) })
    </script>
</body>
</html>
