<body>

    <script>
        'use strict'
        let canvas = document.getElementById('canvas')
        let ctx = canvas.getContext('2d')
        canvas.width = GAME_W
        canvas.height = GAME_H
        // Largest backing-store width; bigger CSS-size x DPR products are scaled down proportionally
        const MAX_BACKING_W = 4096
        // Letterbox: scale the fixed GAME_W x GAME_H canvas uniformly to fit the window, centred.
        // The backing store follows the on-screen size x devicePixelRatio (sharp on HiDPI and
        // when scaled up); drawing code stays in logical GAME_W x GAME_H coordinates via
        // applyViewTransform().
        function fitCanvas()
        {
            let s = Math.min(window.innerWidth / GAME_W, window.innerHeight / GAME_H)
            let w = GAME_W * s, h = GAME_H * s
            canvas.style.width = w + 'px'
            canvas.style.height = h + 'px'
            canvas.style.left = (window.innerWidth - w) / 2 + 'px'
            canvas.style.top = (window.innerHeight - h) / 2 + 'px'
            let k = Math.min(s * (window.devicePixelRatio || 1), MAX_BACKING_W / GAME_W)
            let bw = Math.round(GAME_W * k), bh = Math.round(GAME_H * k)
            if (canvas.width != bw || canvas.height != bh)
            {
                canvas.width = bw
                canvas.height = bh
            }
        }
        // logical GAME_W x GAME_H -> backing-store pixels
        function applyViewTransform()
        {
            let k = canvas.width / GAME_W
            ctx.setTransform(k, 0, 0, k, 0, 0)
        }
        // Re-fit when the device pixel ratio changes (zoom, moving to another monitor)
        function watchDevicePixelRatio()
        {
            let mq = window.matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)')
            mq.addEventListener('change', function() { fitCanvas(); watchDevicePixelRatio() }, {once: true})
        }
        fitCanvas()
        window.addEventListener('resize', fitCanvas)
        if (window.matchMedia)
            watchDevicePixelRatio()
        let cyclesPerTact = 500
        let gravitationalAcceleration = 0.001 / cyclesPerTact //0.000001
            
        let ball = new Ball(10, 20, 80, 0, 0, '#ff0000', 'ball')

        //lines.push(new Line(0, 300, 300, 300, 0, 0, 5, '#0000ff', 'line'))
        //lines.push(new Line(200, 200, 600, 400, 0, 0, 5, '#0000ff', 'line'))
        let linesK
        
        
        let menuIconRect = [
            [GAME_W - 63 - 20, 20],
            [63, 63]
        ]
        let menuIconLine = [
            [5, 13], [-5, 22],
            [5, 28], [-5, 33],
            [5, 43], [-5, 44]
        ]
        let startIconTriangle = 
        [
            [menuIconRect[0][0] - 15, menuIconRect[0][1] + 31],
            [menuIconRect[0][0] - 10 - 54, menuIconRect[0][1] + menuIconRect[1][1] - 5],
            [menuIconRect[0][0] - 10 - 54, menuIconRect[0][1] + menuIconRect[1][1] - 62 + 5]
        ]
        let drawMenu = false
        let drawMenuIcon = true
        let physics = false
        
        let levelStarted = false
        
        function addNewLine(coords)
        {
            coords = dotСorrection(coords[0], coords[1], line.radius)
            if (pointSegDist(ball.posX, ball.posY, line.posX, line.posY, coords[0], coords[1]) <= ball.radius)
                return false
            line.posX2 = coords[0]
            line.posY2 = coords[1]
            line.type = 'player'
            lines.push(line)
            
            return true
        }
        function playerLineCount()
        {
            return lines.filter(function(l) { return l.type == 'player' }).length
        }
        function unfastenLastLine()
        {
            lines.pop()
        }
        // Open level i: the level's saved player lines come back (js/linestore.js: passed, else draft;
        // never in play-tests / the editor)
        function levelChoosed(i)
        {
            levelReset(i)
            linesRestore(i)
        }
        // Level i from scratch: ball at its start, only the level's own lines, linesK 0
        function levelReset(i)
        {
            const L = playtestLevel || levels[i]
            ball.posX = L.ballX
            ball.posY = L.ballY
            ball.speedX = ball.speedY = 0
            lines = L.lines.slice()
            linesK = 0
            levelStarted = false
            physics = false
            playerSel = null
            lockHint = null
            flag = []
            for (let i = 0; i < flagCoords.length; ++i)
            {
                let coord = pointRotation(flagCoords[i][0], flagCoords[i][1], L.flagRotate)
                flag.push(coord)
            }
            
            bounce.setDrawEnable(true)
            portalReset()
            portalRefresh()
            trailReset()
        }
        
        levelReset(thisLevel) // saved lines are restored once boot() has read them
        function inMenuIcon(coords)
        {
            return collisionWithRect(
                coords[0], coords[1], menuIconRect[0][0], menuIconRect[0][1], 
                menuIconRect[0][0] + menuIconRect[1][0], menuIconRect[0][1] + menuIconRect[1][1])
        }
        function inPlayIcon(coords)
        {
            return collisionWithRect(
                coords[0], coords[1], menuIconRect[0][0] - 73, menuIconRect[0][1], menuIconRect[0][0] - 73 + menuIconRect[1][0], menuIconRect[0][1] + menuIconRect[1][1])
        }
        // HUD 'restart' box (artifacts/concepts/82-restart-loop.png): left of the play box, only once
        // a run was started (running or paused); resets the ball but keeps the player's lines
        function restartIconRect()
        {
            return [menuIconRect[0][0] - 146, menuIconRect[0][1], menuIconRect[1][0], menuIconRect[1][1]]
        }
        function inRestartIcon(coords)
        {
            const r = restartIconRect()
            return collisionWithRect(coords[0], coords[1], r[0], r[1], r[0] + r[2], r[1] + r[3])
        }
        function restartIconVisible()
        {
            return levelStarted && !editorMode && !drawMenu && !levelCompletedWindow && drawMenuIcon
        }
        // HUD '3x speed' box (artifacts/concepts/speed/14-arrow-centre-big3x-v2.png): left of the restart box,
        // same 63x63 size and 10 px gap, visible exactly when the restart box is. A click toggles speedMul 1 <-> 3
        // (the execution speed-up itself is TASK-188); saved under SPEED_STORE via the platform facade.
        const SPEED_STORE = 'bp.speed.v1'
        let speedMul = 1
        function speedIconRect()
        {
            const r = restartIconRect()
            return [r[0] - 73, r[1], r[2], r[3]]
        }
        function inSpeedIcon(coords)
        {
            const r = speedIconRect()
            return collisionWithRect(coords[0], coords[1], r[0], r[1], r[0] + r[2], r[1] + r[3])
        }
        function speedIconVisible()
        {
            return restartIconVisible()
        }
        // values: the PLATFORM.storage.getMany result; anything but '3' means 1x
        function speedLoad(values)
        {
            speedMul = values && values[SPEED_STORE] == '3' ? 3 : 1
        }
        function speedToggle()
        {
            speedMul = speedMul == 3 ? 1 : 3
            try
            {
                const p = PLATFORM.storage.setMany({ [SPEED_STORE]: String(speedMul) })
                if (p && p.catch)
                    p.catch(function() {})
            }
            catch (e) {}
        }
        document.addEventListener('click', function(event)
        {
            if (suppressClick)
            {
                suppressClick = false // the click that ends a player-line end drag does nothing
                return
            }
            handleClick(mouseCoords(event))
        })
        // One click (mouse) or tap (touch) at logical coords
        function handleClick(coords)
        {
            if (drawMap && !editorMode)
            {
                mapClick(coords) // route map (js/mapdraw.js): menu icon -> pause menu, level slot -> that level
                return
            }
            if (editorMode)
            {
                editorClick(coords)
                return
            }
            if (playtestLevel && !drawMenu && inEditIcon(coords))
            {
                editorEndPlaytest()
                return
            }
            if (levelCompletedWindow || drawMenu)
            {
                // TASK-255: one layout (menuLayout, js/menu.js) for drawing and hit-testing both windows
                const win = levelCompletedWindow
                const id = menuButtonAt(win ? 'win' : 'pause', coords)
                if (id === null)
                    return
                if (id == 'editor' && playtestLevel)
                {
                    editorEndPlaytest() // play-test: back to the same working copy
                    return
                }
                if (win)
                {
                    TELEMETRY.ui(id == 'next level' ? 'next_level' : id == 'Levels' ? 'map_open' : id == 'editor' ? 'editor_open' : id) // TASK-192
                    levelCompletedWindow = false
                    if (id == 'next level')
                    {
                        levelChoosed(++thisLevel)
                        TELEMETRY.levelStart('next') // TASK-191 (js/telemetry.js)
                    }
                    else if (id == 'restart')
                    {
                        restartKeepLines() // restart: ball back to the start, the player's lines kept
                        TELEMETRY.restart()
                    }
                    else if (id == 'editor')
                    {
                        TELEMETRY.close()
                        editorOpen('win') // edit the level just won
                    }
                    else if (id == 'Levels')
                    {
                        TELEMETRY.leave() // the won attempt just ends (js/telemetry.js)
                        mapOpen()
                    }
                    return
                }
                TELEMETRY.ui(id == 'Levels' ? 'map_open' : id == 'editor' ? 'editor_open' : id == 'skip level' ? 'skip_level' : id) // TASK-192, then menu_close
                TELEMETRY.ui('menu_close')
                if (id == 'skip level')
                {
                    // TASK-260: the next level in play order (as 'next level'); the skipped level stays unsolved,
                    // its lines are kept as a draft, the open attempt ends with 'skip' instead of 'abandon'
                    drawMenu = false
                    drawMenuIcon = true
                    linesSaveDraft()
                    TELEMETRY.skip()
                    levelChoosed(++thisLevel)
                    TELEMETRY.levelStart('skip')
                    return
                }
                if (id == 'Levels')
                {
                    TELEMETRY.leave() // an unwon attempt is abandoned (js/telemetry.js)
                    mapOpen() // full-screen route map replaces the old level grid
                    return
                }
                if (id == 'editor')
                {
                    TELEMETRY.close() // the attempt ends without an event
                    editorOpen('menu')
                    return
                }
                drawMenu = false
                drawMenuIcon = true
                if (id == 'restart')
                {
                    restartKeepLines() // ball back to the start, the player's lines kept
                    TELEMETRY.restart()
                }
            }
            else
            {
                if (speedIconVisible() && inSpeedIcon(coords))
                {
                    speedToggle() // 1x <-> 3x; lines and selection untouched
                    TELEMETRY.ui(speedMul == 3 ? 'speed_on' : 'speed_off') // TASK-192
                    return
                }
                if (restartIconVisible() && inRestartIcon(coords))
                {
                    TELEMETRY.ui('restart') // TASK-192
                    selectionClear()
                    restartKeepLines() // ball back to the start, lines kept and editable again
                    TELEMETRY.restart()
                    return
                }
                if (line)
                {
                    if (!addNewLine(coords))
                        return
                    line = false
                    TELEMETRY.linePlaced() // TASK-192
                    linesSaveDraft() // TASK-185: this level's draft lines (js/linestore.js)
                    bounce.cancel() // an unfinished preview job is dropped
                    if (linesK >= curLevel().lineK)
                    {
                        selectionClear()
                        bounce.setDrawEnable(false)
                        physics = true
                        levelStarted = true
                        TELEMETRY.run(playerLineCount())
                    }
                }
                else
                {
                    if (playerSel !== null && selectionEditable() && inBin(coords))
                    {
                        deleteSelectedLine() // bin: remove the selected player line
                    }
                    else if (!line && inMenuIcon(coords))
                    {
                        TELEMETRY.ui('menu_open') // TASK-192
                        selectionClear()
                        drawMenu = true
                        drawMenuIcon = false
                        physics = false
                    }
                    else if (inPlayIcon(coords))
                    {
                        selectionClear()
                        physics = !physics
                        levelStarted = true
                        TELEMETRY.ui(physics ? 'run' : 'pause') // TASK-192
                        if (physics)
                            TELEMETRY.run(playerLineCount())
                    }
                    else if (levelStarted)
                    {
                        lockClick(coords) // run started: player lines are locked, show a hint
                    }
                    else if (startLineAtEnd(coords))
                    {
                        // a click on a player line end (lines left) started a line there
                    }
                    else if (playerSel !== null && selectionEditable())
                    {
                        selectionClick(coords) // select another player line or deselect; no new line
                    }
                    else if (!levelStarted)
                    {  
                        // a click on a player line selects it (priority over starting a line)
                        const hit = playerLineAt(coords[0], coords[1])
                        if (hit !== null)
                        {
                            playerSel = hit
                            return
                        }
                        if (linesK < curLevel().lineK)
                        {
                            coords = dotСorrection(coords[0], coords[1], dotRadius)
                            if (ball.collisionWithDot(coords[0], coords[1]))
                                return
                            line = new Line(coords[0], coords[1], coords[0], coords[1], dotRadius, '#0000ff', 'line')
                            linesK++
                            TELEMETRY.f30('point1') // TASK-239 (also a touch drag start: touchstart -> handleClick)
                        }
                        else
                            TELEMETRY.lineRejectLimit() // TASK-192: a click on the field with no lines left
                    }
                }
            }
        }
        
        // Editor select tool: drag with the mouse. Outside editor mode a press on a player line
        // end (editable state) drags that end (select.js).
        document.addEventListener('mousedown', function(event)
        {
            if (editorMode)
                return editorMouseDown(mouseCoords(event))
            suppressClick = false
            if (drawMap)
                return // route map: only the click counts (handleClick -> mapClick)
            if (event.button == 0 && !dragStart(mouseCoords(event)))
                lockPress(mouseCoords(event)) // locked after a run: hint only
        })
        document.addEventListener('mouseup', function(event)
        {
            if (editorMode)
                return editorMouseUp(mouseCoords(event))
            if (endDrag && dragDrop(mouseCoords(event)))
                suppressClick = true
        })
        document.addEventListener('mousemove', function(event)
        {
            if (editorMode)
            {
                // primary button no longer down: the mouseup was lost (window lost focus, released
                // outside the page), so no drop happened -> cancel the drag, move nothing this event
                if ((editor.drag || editor.barDrag) && (event.buttons & 1) == 0)
                    return editorCancelDrag()
                return editorMouseMove(mouseCoords(event))
            }
            if (drawMap)
                return mapMove(mouseCoords(event)) // route map: hover highlight + preview card (js/mapdraw.js)
            if (endDrag)
            {
                if ((event.buttons & 1) == 0)
                    return dragCancel() // the mouseup was lost: no drop
                return dragMove(mouseCoords(event))
            }
            if (line)
                bounce.request(mouseCoords(event)) // computed progressively in gameLoop (bounce.update)
        })

        // Touch: a tap (touchend within TAP_SLOP logical px of touchstart) goes through handleClick()
        // like a mouse click; a drag on the play field starts a line at touchstart, previews it on
        // touchmove (as mousemove does) and finishes it at touchend (as the second click does).
        // preventDefault everywhere: no page scroll/zoom and no duplicate synthetic mouse click.
        const TAP_SLOP = 10
        let touch = null // {id, start, last, moved, startedLine, drag}
        // Would a click at coords start a new line? (same conditions as handleClick)
        function lineStartAccepted(coords)
        {
            if (editorMode || drawMap || levelCompletedWindow || drawMenu || line || levelStarted)
                return false
            if (inMenuIcon(coords) || inPlayIcon(coords) || (playtestLevel && inEditIcon(coords)) || (restartIconVisible() && inRestartIcon(coords)) || (speedIconVisible() && inSpeedIcon(coords)))
                return false
            if (endStartPoint(coords))
                return true // on a player line end with lines left: a line starts at that end
            if (playerSel !== null || playerLineAt(coords[0], coords[1]) !== null)
                return false // the tap selects / deselects / deletes instead (handleClick at touchend)
            if (linesK >= curLevel().lineK)
                return false
            let c = dotСorrection(coords[0], coords[1], dotRadius)
            return !ball.collisionWithDot(c[0], c[1])
        }
        function findTouch(list)
        {
            for (let i = 0; i < list.length; ++i)
                if (list[i].identifier === touch.id)
                    return list[i]
            return null
        }
        function touchMoveTo(coords)
        {
            if (editorMode)
                return editorMouseMove(coords)
            if (endDrag)
                return dragMove(coords)
            if (line)
            {
                line.posX2 = coords[0]
                line.posY2 = coords[1]
                bounce.request(coords)
            }
        }
        canvas.addEventListener('touchstart', function(event)
        {
            event.preventDefault()
            if (touch)
                return // ignore extra fingers
            let t = event.changedTouches[0]
            let coords = mouseCoords(t)
            touch = {id: t.identifier, start: coords, last: coords, moved: false, startedLine: false, drag: false}
            if (editorMode)
                editorMouseDown(coords)
            else if (drawMap)
                {} // route map: the tap at touchend goes through handleClick -> mapClick
            else if (dragStart(coords))
                touch.drag = true // on a player line end: drag it instead of starting a line
            else
                lockPress(coords) // locked after a run: hint only
            if (!touch.drag && lineStartAccepted(coords))
            {
                handleClick(coords)
                touch.startedLine = !!line
            }
        }, {passive: false})
        canvas.addEventListener('touchmove', function(event)
        {
            event.preventDefault()
            if (!touch)
                return
            let t = findTouch(event.changedTouches)
            if (!t)
                return
            let coords = mouseCoords(t)
            touch.last = coords
            if (Math.hypot(coords[0] - touch.start[0], coords[1] - touch.start[1]) > TAP_SLOP)
                touch.moved = true
            touchMoveTo(coords)
        }, {passive: false})
        canvas.addEventListener('touchend', function(event)
        {
            event.preventDefault()
            if (!touch)
                return
            let t = findTouch(event.changedTouches)
            if (!t)
                return
            let coords = mouseCoords(t)
            let s = touch
            touch = null
            if (editorMode)
                editorMouseUp(coords)
            let tap = Math.hypot(coords[0] - s.start[0], coords[1] - s.start[1]) <= TAP_SLOP && !s.moved
            if (s.drag)
            {
                if (tap)
                {
                    dragCancel(true) // a tap on an end: select / deselect / bin as before
                    handleClick(s.start)
                }
                else
                    dragDrop(coords)
            }
            else if (tap)
            {
                // a tap that started a line already acted as the first click
                if (!s.startedLine)
                    handleClick(s.start)
            }
            else if (line)
            {
                touchMoveTo(coords)
                handleClick(coords)
            }
        }, {passive: false})
        canvas.addEventListener('touchcancel', function(event)
        {
            if (event.cancelable)
                event.preventDefault()
            touch = null
            if (editorMode)
                editorCancelDrag()
            dragCancel() // an end drag is reverted
        }, {passive: false})
        function gamePhysics()
        {
            ball.physics()
            ball.move()
            portalStep()
        }
        function restart()
        {
            levelChoosed(thisLevel)
        }
        // Reset the level but keep the player's lines and linesK, so the player can press play again.
        // Called on automatic failure (ball off the map) and by every restart button (HUD, menu,
        // win window). restart() above is the full reset (levelChoosed), used only by the sim tests.
        function restartKeepLines()
        {
            const kept = lines.filter(function(l) { return l.type == 'player' })
            const k = linesK
            levelReset(thisLevel)
            for (let i = 0; i < kept.length; ++i)
                lines.push(kept[i])
            linesK = k
            bounce.positions = [] // no stale path preview
        }
        function gameMechanics()
        {
            if (physics && !editorMode)
            {
                // TASK-188: speedMul (1 or 3) chunks of cyclesPerTact steps per frame. Each chunk is exactly
                // one 1x frame (same steps, same per-step flag / off-map handling, one trail sample), so a 3x
                // run follows the same path and draws the same trail. A win or an off-map restart ends the
                // frame after its chunk (no further chunks).
                for (let c = 0; c < speedMul; ++c)
                {
                    const teleports0 = portalState.teleports.length
                    const won0 = levelCompletedWindow
                    let offMap = false
                    for (let i = 0; i < cyclesPerTact; ++i)
                    {
                        gamePhysics()
                        if (flagCollision(curLevel().flagX, curLevel().flagY))
                        {
                            if (playtestLevel)
                            {
                                if (!levelCompletedWindow)
                                    TELEMETRY.win() // TASK-235: edit:<h>:win
                                levelCompletedWindow = true // play-test: no unlock bookkeeping
                                continue
                            }
                            if (!levelCompletedWindow)
                            {
                                levels[thisLevel].unlock = 2 // completed; saved by srcId (TASK-178)
                                saveProgress()
                                linesSavePassed() // TASK-185: the lines that won this level
                                TELEMETRY.win() // TASK-191
                            }
                            levelCompletedWindow = true
                        }
                        if (!ball.onMap())
                        {
                            restartKeepLines() // reset level, keep player lines: no more physics steps this frame
                            TELEMETRY.offMap() // Fail + fail:offmap, then the next attempt (js/telemetry.js)
                            offMap = true
                            break
                        }
                    }
                    // trail: one sample per chunk (drawing only; a teleport starts a new segment)
                    if (physics)
                        trailRecord(portalState.teleports.length !== teleports0)
                    if (offMap || !physics || (levelCompletedWindow && !won0))
                        break
                }
            }
        }
        let telemetryFrameAt = null
        function gameLoop(frameTime)
        {
            // TASK-192: active play time (TELEMETRY.tick counts only while a level is played in a visible page);
            // one frame counts at most 1 s (a throttled background tab adds nothing)
            const tNow = performance.now()
            TELEMETRY.firstFrame(frameTime) // TASK-238: t0 (once): load:/ctx: events, bp.first.v1 (TASK-240: frame time)
            if (telemetryFrameAt !== null)
                TELEMETRY.tick(Math.min(1000, tNow - telemetryFrameAt))
            telemetryFrameAt = tNow

            bounce.update(6) // progressive path preview: at most ~6 ms of physics per frame
            editorPreviewUpdate(6) // editor: live path preview of the working copy (same budget)

            draw()

            gameMechanics()
            
            menu()
            
            requestAnimationFrame(gameLoop)
        }
        // Start drawing only once the handwriting font is ready (falls back to
        // starting anyway if the font cannot be loaded).
        let fontsReady = document.fonts
            ? document.fonts.load('24px ' + THEME.fontStack).catch(function() {})
            : Promise.resolve()
        // Boot (TASK-184): platform init, then the saved progress and editor toolbar position are read
        // through the platform facade, all before the first frame. bootComplete marks the end.
        // Analytics (TASK-190): the grapnelninja ANALYTICS facade (analytics.js) with the gameanalytics
        // backend (tests may swap in analytics/backends/none.js). Build = BUILD_CONFIG.build
        // ('<git short sha>-<YYYYMMDD>', tools/stamp_build.py; 'dev-<today>' when unstamped), prefixed
        // 'test-' for automated browsers (navigator.webdriver) and ?gaTest=1 so reports can drop them.
        function analyticsBuild()
        {
            const cfg = typeof BUILD_CONFIG === 'object' && BUILD_CONFIG || (window.BUILD_CONFIG = {})
            if (!cfg.build)
            {
                const d = new Date(), pad = n => String(n).padStart(2, '0')
                cfg.build = 'dev-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate())
            }
            const testRun = navigator.webdriver === true || /[?&]gaTest=1(&|$)/.test(location.search)
            return (testRun ? 'test-' : '') + cfg.build
        }
        function analyticsStart()
        {
            // Added before ANALYTICS.init: the gameanalytics backend's own pagehide handler runs after this one
            window.addEventListener('pagehide', function()
            {
                TELEMETRY.editorAbandon() // TASK-232: editor:actions + editor:abandon while the editor is open
                TELEMETRY.leave() // TASK-191: an unwon attempt is abandoned before the flush
                TELEMETRY.pageHide() // TASK-192: session:levels_seen
                TELEMETRY.f30PageHide() // TASK-239: f30:<k>:leave + leave_step inside the first 30 s
                ANALYTICS.flush()
                ANALYTICS.sessionEnd()
            })
            document.addEventListener('visibilitychange', function()
            {
                if (document.visibilityState === 'hidden')
                {
                    TELEMETRY.hidden() // TASK-192: session:hide
                    TELEMETRY.f30Hidden() // TASK-239: f30 leave (inside the first 30 s), 'hidden' step, flush
                }
            })
            // TASK-239: first-30 pointer steps (capture: every press / move anywhere, before any handler)
            // TASK-240: + every press as f30:press:<target>:<cell> and the pointer path / last input for the heartbeat
            for (const type of ['mousemove', 'touchmove'])
                document.addEventListener(type, function(e)
                {
                    TELEMETRY.f30('first_move')
                    f30Pointer(e, false)
                }, {capture: true, passive: true})
            for (const type of ['mousedown', 'touchstart'])
                document.addEventListener(type, function(e)
                {
                    TELEMETRY.f30('first_press')
                    const points = e.changedTouches ? Array.from(e.changedTouches) : [e]
                    for (const pt of points)
                    {
                        const c = mouseCoords(pt)
                        TELEMETRY.f30Press(f30PressTarget(c), c[0], c[1])
                    }
                    f30Pointer(e, type == 'touchstart')
                }, {capture: true, passive: true})
            for (const type of ['mouseup', 'touchend'])
                document.addEventListener(type, function(e) { f30Pointer(e, false) }, {capture: true, passive: true})
            document.addEventListener('keydown', function() { TELEMETRY.f30Input() }, {capture: true, passive: true})
            // A page restored from the back/forward cache opens a new session
            window.addEventListener('pageshow', function(e)
            {
                if (e.persisted)
                    ANALYTICS.sessionStart()
            })
            ANALYTICS.init({build: analyticsBuild()})
            ANALYTICS.sessionStart()
        }
        // TASK-240: pointer input for the f30 heartbeat (path length in logical px, last input time)
        function f30Pointer(e, newPath)
        {
            const pt = e.changedTouches ? e.changedTouches[0] : e
            if (!pt)
                return TELEMETRY.f30Input()
            const c = mouseCoords(pt)
            TELEMETRY.f30Input(c[0], c[1], newPath)
        }
        // TASK-240: what a press at logical coords c hits, with the game's own hit tests, in handleClick's priority
        // (called in the capture phase, before any game handler acts on the press)
        function f30PressTarget(c)
        {
            const x = c[0], y = c[1]
            if (drawMap && !editorMode)
                return 'map'
            if (editorMode || levelCompletedWindow || !(x >= 0 && y >= 0 && x <= GAME_W && y <= GAME_H))
                return 'other' // editor, completion window, outside the field (letterbox)
            if (drawMenu)
                return 'menu'
            if (playtestLevel && inEditIcon(c))
                return 'other'
            if (inMenuIcon(c))
                return 'hud_menu'
            if (inPlayIcon(c))
                return 'hud_play'
            if (restartIconVisible() && inRestartIcon(c))
                return 'hud_restart'
            if (speedIconVisible() && inSpeedIcon(c))
                return 'hud_speed'
            if (playerSel !== null && selectionEditable() && inBin(c))
                return 'bin'
            if (playerEndAt(x, y))
                return 'line_end'
            if (playerLineAt(x, y) !== null)
                return 'line'
            if (ball.dotHit(x, y))
                return 'ball'
            if (flag.length)
            {
                const L = curLevel(), xs = flag.map(p => L.flagX + p[0]), ys = flag.map(p => L.flagY + p[1])
                if (x >= Math.min(...xs) && x <= Math.max(...xs) && y >= Math.min(...ys) && y <= Math.max(...ys))
                    return 'flag' // the flag's bounding box (pole + pennant)
            }
            return 'field'
        }
        let bootComplete = false
        async function boot()
        {
            TELEMETRY.loadMark('boot') // TASK-238: load:<stage> marks (js/telemetry.js)
            analyticsStart()
            await PLATFORM.init()
            TELEMETRY.loadMark('platform')
            const saved = await PLATFORM.storage.getMany([PROGRESS_STORE, EDITOR_BAR_STORE, LINES_STORE, SPEED_STORE, STATS_STORE, FIRST_STORE])
            TELEMETRY.loadMark('storage')
            loadProgress(saved)
            editorBarLoad(saved)
            linesLoad(saved)
            speedLoad(saved)
            TELEMETRY.load(saved)
            if (!levelStarted && !line && !editorMode && !playtestLevel)
            {
                levelChoosed(thisLevel) // the current level with its saved lines
                TELEMETRY.levelStart('boot') // TASK-191: opening the page starts an attempt
            }
            await fontsReady
            TELEMETRY.loadMark('fonts')
            bootComplete = true
            requestAnimationFrame(gameLoop)
        }
        // TASK-238: boot starts once DOMContentLoaded has finished (load:dom <= load:boot)
        if (document.readyState === 'loading')
            document.addEventListener('DOMContentLoaded', function() { setTimeout(boot, 0) }, {once: true})
        else
            boot()
    </script>
</body>
